# Mangle settings (sourced by bin/mangle.sh). Uncomment to change.

# Folder with books made by prep.py.
#MANGLE_LIBRARY=/mnt/us/manga

# Full flashing refresh every N page turns (clears ghosting). 0 = never.
#FLASH_EVERY=8

# Waveform for normal turns: gc16 (default), gl16, reagl, du, auto.
#export MANGLE_WFM=gc16

# Touch coordinate fixes if taps land in the wrong place on your model:
# any of swap, mirror_x, mirror_y (comma separated).
#export MANGLE_TOUCH=

# Force the touchscreen device if it isn't detected.
#export MANGLE_TOUCH_DEV=/dev/input/event1
