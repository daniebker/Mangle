; Mangle firmware for the ESP32-3248S035 "Cheap Yellow Display" (3.5", 320x480).
;
;   pio run -e cyd35r -t upload     resistive touch (XPT2046), the "R" board
;   pio run -e cyd35c -t upload     capacitive touch (GT911), the "C" board
;
; Pins and options are in src/board/board.h; override them with -D below.
; Desktop tests of the same code: `make test` in this folder.

[platformio]
default_envs = cyd35r

[env]
platform = espressif32
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
	-I$PROJECT_DIR/src
	-I$PROJECT_DIR/src/compat
	-I$PROJECT_DIR/../reader/src
	-I$PROJECT_DIR/../reader/third_party/miniz
	-DMINIZ_NO_STDIO
	-DMINIZ_NO_TIME
	-DMINIZ_NO_ZLIB_COMPATIBLE_NAMES
	-O2
build_unflags = -Os

[env:cyd35r]
build_flags = ${env.build_flags}

[env:cyd35c]
build_flags = ${env.build_flags} -DTOUCH_GT911
