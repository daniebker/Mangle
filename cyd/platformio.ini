; Mangle firmware for ESP32 touch-screen boards.
;
;   pio run -e cyd35r -t upload       ESP32-3248S035R  (3.5" CYD, ESP32, resistive touch)
;   pio run -e cyd35c -t upload       ESP32-3248S035C  (3.5" CYD, ESP32, capacitive touch)
;   pio run -e freenove35 -t upload   Freenove FNK0104N (3.5" ESP32-S3 Display, capacitive touch)
;
; The app is the shared code in ../common (src/common/ compiles it). Each board
; has its own folder in src/boards/ (display, touch, SD card, pins in board.h);
; src/esp32/ is what they share (input loop, sleep, backlight, Wi-Fi clock).
; Desktop tests of the same app: `make -C ../common test`.

[platformio]
default_envs = cyd35r

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
	-I$PROJECT_DIR/../common/src
	-I$PROJECT_DIR/../common/src/compat
	-I$PROJECT_DIR/../common/third_party/miniz
	-I$PROJECT_DIR/src/esp32
	-DMINIZ_NO_STDIO
	-DMINIZ_NO_TIME
	-DMINIZ_NO_ZLIB_COMPATIBLE_NAMES
	-O2
build_unflags = -Os

; ---- ESP32-3248S035 (ESP32, 4 MB flash, no PSRAM) ----------------------------------------
[esp32_3248s035]
board = esp32dev
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.partitions = huge_app.csv
upload_speed = 921600
build_src_filter = +<*> -<boards/> +<boards/esp32_3248s035/> -<common/fb.c>
build_flags = ${env.build_flags} -I$PROJECT_DIR/src/boards/esp32_3248s035

[env:cyd35r]
extends = esp32_3248s035

[env:cyd35c]
extends = esp32_3248s035
build_flags = ${esp32_3248s035.build_flags} -DTOUCH_GT911

; ---- Freenove FNK0104N (ESP32-S3R8: 8 MB octal PSRAM, 16 MB flash, native USB) -----------
[env:freenove35]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_speed = 921600
build_src_filter = +<*> -<boards/> +<boards/freenove_fnk0104n/>
; The panel's init sequence is fetched from Freenove at build time (see the script).
extra_scripts = pre:src/boards/freenove_fnk0104n/fetch_init.py
build_flags =
	${env.build_flags}
	-I$PROJECT_DIR/src/boards/freenove_fnk0104n
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
