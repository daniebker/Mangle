name: Build

# Tests and Kindle builds run on every push to main and on pull requests.
# Pushing a version tag (v*) also publishes the built files as a GitHub release.
# The CYD firmware has its own workflow (firmware.yml), which adds its images
# to the same release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel half-published releases on tags; do cancel stale PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  KOXTOOLCHAIN_VERSION: "2026.08"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Kumiko submodule
        # .gitmodules uses an SSH URL; fetch it over HTTPS instead.
        run: git -c "url.https://github.com/.insteadOf=git@github.com:" submodule update --init --depth 1

      - name: Install Python dependencies
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip install -r preprocessor/requirements.txt pytest

      - name: Run tests
        run: PYTHON=~/venv/bin/python ./build.sh test

  kindle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [kindlehf, kindlepw2]
    steps:
      - uses: actions/checkout@v7

      - name: Cache toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          path: ~/x-tools
          key: koxtoolchain-${{ env.KOXTOOLCHAIN_VERSION }}-${{ matrix.target }}

      - name: Install toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: ./build.sh toolchain ${{ matrix.target }}

      - name: Build and package
        run: ./build.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: mangle-kual-${{ matrix.target }}
          path: reader/dist/mangle-kual-${{ matrix.target }}.zip
          if-no-files-found: error

  preprocessor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Kumiko submodule
        # .gitmodules uses an SSH URL; fetch it over HTTPS instead.
        run: git -c "url.https://github.com/.insteadOf=git@github.com:" submodule update --init --depth 1

      - name: Package preprocessor
        run: |
          mkdir -p dist/mangle-preprocessor/kumiko
          cp -r preprocessor/prep.py preprocessor/preview.py preprocessor/mangle_prep \
                preprocessor/requirements.txt README.md LICENSE dist/mangle-preprocessor/
          # Kumiko's runtime files only (prep.py finds it at ./kumiko/kumiko).
          cp -r preprocessor/kumiko/kumiko preprocessor/kumiko/kumikolib.py preprocessor/kumiko/lib \
                preprocessor/kumiko/LICENSE preprocessor/kumiko/README.md dist/mangle-preprocessor/kumiko/
          find dist -name __pycache__ -prune -exec rm -r {} +
          (cd dist && zip -qr mangle-preprocessor.zip mangle-preprocessor)

      - uses: actions/upload-artifact@v7
        with:
          name: mangle-preprocessor
          path: dist/mangle-preprocessor.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, kindle, preprocessor]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS
          short=${SHA:0:7}
          cat > notes.md <<EOF
          Built from \`$short\` ($TAG).

          | File | For |
          |---|---|
          | \`mangle-kual-kindlehf.zip\` | Kindle on firmware 5.16.3 and newer |
          | \`mangle-kual-kindlepw2.zip\` | Kindle on older 5.x firmware |
          | \`mangle-preprocessor.zip\` | The desktop preprocessor (\`prep.py\`, \`preview.py\`, with Kumiko) |
          | \`mangle-cyd35r.bin\` | Cheap Yellow Display 3.5" firmware, resistive touch (ESP32-3248S035R): flash at 0x0 |
          | \`mangle-cyd35c.bin\` | Cheap Yellow Display 3.5" firmware, capacitive touch (ESP32-3248S035C): flash at 0x0 |
          | \`mangle-freenove35.bin\` | Freenove ESP32-S3 Display 3.5" firmware (FNK0104N): flash at 0x0 |

          Unzip the KUAL package into \`/mnt/us/extensions/\` on the Kindle.
          The CYD firmware is attached by its own workflow, so it may appear a few minutes later
          (checksums in \`SHA256SUMS-cyd\`). Install it from the browser with the web flasher:
          https://${GH_REPO%%/*}.github.io/${GH_REPO#*/}/?tag=$TAG
          EOF
          # firmware.yml may have created the release first: then add to it.
          if gh release view "$TAG" >/dev/null 2>&1 ||
             ! gh release create "$TAG" *.zip SHA256SUMS --verify-tag --title "Mangle $TAG ($short)" \
               --notes-file notes.md --latest; then
            gh release upload "$TAG" *.zip SHA256SUMS --clobber
            gh release edit "$TAG" --title "Mangle $TAG ($short)" --notes-file notes.md --latest
          fi
