name: Build

# Tests, Kindle and CYD firmware builds run on every push and pull request.
# Pushing a version tag (v*) also publishes the built files as a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel half-published releases on tags; do cancel stale PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  KOXTOOLCHAIN_VERSION: "2026.08"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Kumiko submodule
        # .gitmodules uses an SSH URL; fetch it over HTTPS instead.
        run: git -c "url.https://github.com/.insteadOf=git@github.com:" submodule update --init --depth 1

      - name: Install Python dependencies
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip install -r preprocessor/requirements.txt pytest

      - name: Run tests
        run: PYTHON=~/venv/bin/python ./build.sh test

  kindle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [kindlehf, kindlepw2]
    steps:
      - uses: actions/checkout@v7

      - name: Cache toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          path: ~/x-tools
          key: koxtoolchain-${{ env.KOXTOOLCHAIN_VERSION }}-${{ matrix.target }}

      - name: Install toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: ./build.sh toolchain ${{ matrix.target }}

      - name: Build and package
        run: ./build.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: mangle-kual-${{ matrix.target }}
          path: reader/dist/mangle-kual-${{ matrix.target }}.zip
          if-no-files-found: error

  cyd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [cyd35r, cyd35c]
    steps:
      - uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('cyd/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio esptool==4.8.1

      - name: Build firmware
        run: cd cyd && pio run -e ${{ matrix.env }}

      - name: Merge into one image (flash at 0x0)
        run: |
          b=cyd/.pio/build/${{ matrix.env }}
          boot_app0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          python -m esptool --chip esp32 merge_bin -o mangle-${{ matrix.env }}.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x1000 $b/bootloader.bin 0x8000 $b/partitions.bin 0xe000 "$boot_app0" 0x10000 $b/firmware.bin

      - uses: actions/upload-artifact@v7
        with:
          name: mangle-${{ matrix.env }}
          path: mangle-${{ matrix.env }}.bin
          if-no-files-found: error

  preprocessor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Kumiko submodule
        # .gitmodules uses an SSH URL; fetch it over HTTPS instead.
        run: git -c "url.https://github.com/.insteadOf=git@github.com:" submodule update --init --depth 1

      - name: Package preprocessor
        run: |
          mkdir -p dist/mangle-preprocessor/kumiko
          cp -r preprocessor/prep.py preprocessor/preview.py preprocessor/mangle_prep \
                preprocessor/requirements.txt README.md LICENSE dist/mangle-preprocessor/
          # Kumiko's runtime files only (prep.py finds it at ./kumiko/kumiko).
          cp -r preprocessor/kumiko/kumiko preprocessor/kumiko/kumikolib.py preprocessor/kumiko/lib \
                preprocessor/kumiko/LICENSE preprocessor/kumiko/README.md dist/mangle-preprocessor/kumiko/
          find dist -name __pycache__ -prune -exec rm -r {} +
          (cd dist && zip -qr mangle-preprocessor.zip mangle-preprocessor)

      - uses: actions/upload-artifact@v7
        with:
          name: mangle-preprocessor
          path: dist/mangle-preprocessor.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, kindle, cyd, preprocessor]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          cd dist
          sha256sum *.zip *.bin > SHA256SUMS
          short=${SHA:0:7}
          cat > notes.md <<EOF
          Built from \`$short\` ($TAG).

          | File | For |
          |---|---|
          | \`mangle-kual-kindlehf.zip\` | Kindle on firmware 5.16.3 and newer |
          | \`mangle-kual-kindlepw2.zip\` | Kindle on older 5.x firmware |
          | \`mangle-preprocessor.zip\` | The desktop preprocessor (\`prep.py\`, \`preview.py\`, with Kumiko) |

          Unzip the KUAL package into \`/mnt/us/extensions/\` on the Kindle.
          EOF
          gh release create "$TAG" *.zip *.bin SHA256SUMS \
            --verify-tag \
            --title "Mangle $TAG ($short)" \
            --notes-file notes.md \
            --latest
